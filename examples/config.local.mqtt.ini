; examples/config.local.mqtt.ini
; Local config for testing the bridge with a local MQTT broker (recommended)
; Public template only. Do not put production passwords or API tokens here.

[DEFAULT]
MESHTASTIC_SERIAL_PORT = /dev/ttyUSB0
EXTERNAL_TRANSPORT = mqtt

; MQTT settings
MQTT_BROKER = localhost
MQTT_PORT = 1883
MQTT_TOPIC_IN = ammb/to_meshtastic
MQTT_TOPIC_OUT = ammb/from_meshtastic
MQTT_CLIENT_ID = ammb_test_client
MQTT_QOS = 0
MQTT_RETAIN_OUT = False
MQTT_PAYLOAD_FORMAT = json

; Observer firmware example (CoreScope / LetsMesh packets topic):
; MQTT_TOPIC_IN = meshcore/+/+/packets
; MQTT_TOPIC_OUT = meshcore/SEA/ammb_bridge/packets
; MQTT_PAYLOAD_FORMAT = observer
; MESHCORE_INCLUDE_PUBLIC = True

; Bridge & common
EXTERNAL_NETWORK_ID = test_net
BRIDGE_NODE_ID = !ammb_test
MESSAGE_QUEUE_SIZE = 100
LOG_LEVEL = DEBUG

; API (optional)
API_ENABLED = True
API_HOST = 127.0.0.1
API_PORT = 8080

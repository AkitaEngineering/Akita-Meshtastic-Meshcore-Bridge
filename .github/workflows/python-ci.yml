# .github/workflows/python-ci.yml
# Lint, type-check, and test the AMMB project.

name: Python CI for AMMB

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint with flake8
        run: |
          flake8 ammb tests run_bridge.py run_bridge_async.py run_bridge_tui.py --select=E9,F63,F7,F82 --show-source --statistics
          flake8 ammb tests run_bridge.py run_bridge_async.py run_bridge_tui.py

      - name: Type check with mypy
        run: |
          mypy ammb/version.py ammb/api.py ammb/api_async.py \
            ammb/bridge_async.py ammb/message_logger.py \
            ammb/metrics.py ammb/rate_limiter.py \
            run_bridge.py run_bridge_async.py

      - name: Test with pytest
        run: |
          pytest --cov=ammb --cov-report=term-missing --cov-report=xml
